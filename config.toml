onboarding = false
[theme]
name = "terminal"   # neutral base; every palette token is overridden below by Sora
auto_switch = false

[theme.custom]
accent      = "#80c8e0"
panel_bg    = "#0e1018"
surface0    = "#14161e"
surface1    = "#171a24"
surface_dim = "#0a0c12"
overlay0    = "#586478"
overlay1    = "#8898b8"
text        = "#c8d0e0"
subtext0    = "#9aa4b8"
mauve       = "#b0a0d8"
green       = "#90c8a0"
yellow      = "#d4b878"
red         = "#d0909c"
blue        = "#6898b8"
teal        = "#78b8b0"
peach       = "#d0a888"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# Herdr prefix
prefix = "ctrl+a"

# Navigation — same as tmux
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Splitting — same as tmux
split_vertical = "prefix+minus"

# Resize
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = false

mouse_capture = true
copy_on_select = true

pane_borders = "auto"
pane_outer_borders = true
pane_scrollbars = true
pane_gaps = true

agent_panel_sort = "spaces"
status_indicators = "dots"

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
manage_ssh_config = true

[experimental]
allow_nested = false
pane_history = false

# [advanced]
# scrollback_limit_bytes = 10000000
